# Nginx reverse proxy for a Docker deployment that binds Sub2API to localhost.
# Place this file in /etc/nginx/conf.d/sub2api.conf on Ubuntu/Debian.

map $http_upgrade $sub2api_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sub2api_upstream {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 256m;

    location / {
        proxy_pass http://sub2api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sub2api_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
