# =============================================================================
# vendor.aspai.top —— 号商(账号供货商)专用实例的「公网 UI 入口」
# =============================================================================
# 设计意图(两条通道分离):
#
#   1) 前端 UI / 登录 / OAuth 授权  →  走外网(本文件)
#      号商在自己浏览器登录、授权账号、管分组/指纹/IP/看用量。
#
#   2) API Key 数据面(网关 /v1 等)  →  只走本地,禁止外网
#      主站通过 docker 内网 http://sub2api-vendor:8080 调用,不经过本入口。
#      因此下面把所有网关路径显式 404 —— 号商的 key 无法从公网被调用。
#
# 后端:127.0.0.1:18090(号商实例,已开 VENDOR_MODE_ENABLED,管理面只剩六模块)
# 证书:复用 aspai.top 证书(站点在 Cloudflare "Full" 之后,与 bot.aspai.top 同样处理)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vendor.aspai.top;

    ssl_certificate        /www/server/panel/vhost/cert/aspai.top/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/aspai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;

    access_log /www/wwwlogs/vendor.aspai.top.log;
    error_log  /www/wwwlogs/vendor.aspai.top.error.log;

    # 后续若要签发独立证书(不再依赖 Cloudflare Full):
    # certbot certonly --webroot -w /www/wwwroot/vendor.aspai.top -d vendor.aspai.top
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/vendor.aspai.top;
    }

    # ---------------------------------------------------------------------
    # 数据面(网关)一律禁止从公网访问 —— 号商的 key 只能由主站在内网调用。
    # 这些前缀取自后端网关路由注册表;面板 API 在 /api/v1/ 之下,不受影响。
    # ---------------------------------------------------------------------
    location ~ ^/(v1|v1beta|responses|chat/completions|messages|models|embeddings|images|videos|tts|stt|realtime|antigravity|backend-api|alpha|custom-voices)(/|$) {
        return 404;
    }

    # ---------------------------------------------------------------------
    # 其余(SPA 页面、静态资源、/api/v1/* 面板接口)正常反代到号商实例。
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级(面板若有实时组件)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
